# ═══════════════════════════════════════════════════════════════════════════
# BabaHakim — nginx reverse proxy (PHASE 19 · spec §75: Nginx + SSL + Domain)
# TLS termination + security headers + gzip + upload budget + health routing.
# Certificates: deploy/nginx/certs/fullchain.pem + privkey.pem
#   dev/staging self-signed:  bash deploy/nginx/gen-self-signed.sh
#   production Let's Encrypt: see DEPLOYMENT.md §6 (certbot webroot/certonly)
# App CSP is the single source of truth (next.config.ts headers) — nginx adds
# transport-level headers only (HSTS + hide version), not a second CSP.
# ═══════════════════════════════════════════════════════════════════════════

upstream babahakim_app {
    server app:3000;
    keepalive 32;
    # passive health: a booting container (migrations) is skipped, not served
    max_fails 3;
    fail_timeout 15s;
}

# rate-limit zone: login/otp/auth burst endpoints (app also rate-limits
# per-IP + per-account in-process — nginx adds a coarse first line)
limit_req_zone $binary_remote_addr zone=bh_auth:10m rate=10r/m;
# generic API budget
limit_req_zone $binary_remote_addr zone=bh_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge (Let's Encrypt renewal — keep BEFORE the redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # everything else → HTTPS (spec §75 SSL; no plain-text API ever)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── TLS (spec §75) ────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── hardening (transport level; app CSP lives in next.config.ts) ──────
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    client_max_body_size 25m;          # tongue-image uploads (validated + resized server-side)

    # ── gzip (spec §75 logging/monitoring-adjacent; app already compresses
    #    responses — nginx re-compresses only what arrives identity) ───────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── health probes: answering these is nginx's job (app not probed
    #    through the public path — avoids metric inflation, PHASE 15) ─────
    location = /health {
        access_log off;
        proxy_pass http://babahakim_app;
        proxy_connect_timeout 3s;
    }

    # ── auth endpoints: coarse per-IP budget before the app's own limiter ─
    location /api/v1/auth/ {
        limit_req zone=bh_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://babahakim_app;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── everything else: the app (API + SPA + signed media URLs) ─────────
    location / {
        limit_req zone=bh_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://babahakim_app;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # access log (json-file docker driver rotates; DEPLOYMENT.md §8 ships to
    # the observability stack on the host)
    access_log /var/log/nginx/babahakim.access.log;
    error_log  /var/log/nginx/babahakim.error.log warn;
}
