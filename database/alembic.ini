# BabaHakim — Alembic configuration (PHASE 04 Database Architecture)
# Run all commands from the database/ directory:
#   .venv/bin/alembic upgrade head          # apply migrations
#   .venv/bin/alembic revision --autogenerate -m "..."   # new migration from models
#   .venv/bin/alembic check                 # verify models == database
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# URL is resolved at runtime: PGDATABASE_URL env var, else database/.pgurl, else dev default
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
